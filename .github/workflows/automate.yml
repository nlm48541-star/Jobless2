name: RSS Video Automation System

on:
  repository_dispatch:
    types: [rss_video_check] 
  workflow_dispatch: 

# 🌟 কোনো অবস্থাতেই রানিং ভিডিও রেন্ডারিং ক্যানসেল হবে না
concurrency:
  group: rss-automation-jobless
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 🌟 Rclone, FFmpeg ও বাংলা ফন্ট ইনস্টল
      - name: Install System Dependencies (Fonts, FFmpeg, Rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-beng fonts-beng-extra libraqm-dev libraqm0 libfribidi0 libharfbuzz0b ffmpeg rclone

      # 🌟 Rclone কনফিগারেশন সেটআপ
      - name: Configure Rclone
        shell: python
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          import os
          conf_data = os.environ.get('RCLONE_CONF_DATA', '').strip()
          if conf_data:
              config_path = os.path.expanduser('~/.config/rclone/rclone.conf')
              os.makedirs(os.path.dirname(config_path), exist_ok=True)
              with open(config_path, 'w', encoding='utf-8') as f:
                  f.write(conf_data)
              print("✅ Rclone configured successfully.")
          else:
              print("ℹ️ RCLONE_CONF is empty, running in RSS-only mode.")

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🌟 পাইথন রান
      - name: Run Python Process (Manual Drive & RSS Auto)
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          ENABLE_MANUAL_FOLDER: ${{ secrets.ENABLE_MANUAL_FOLDER }}
          MANUAL_DRIVE_FOLDER_ID: ${{ secrets.MANUAL_DRIVE_FOLDER_ID }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          OLLAMA_API_KEYS: ${{ secrets.OLLAMA_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python main.py

      - name: Save & Commit History and API Key Trackers
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add workspace/history.txt api_key_tracker.json 2>/dev/null || true
          git commit -m "Update upload history & active API key tracker [skip ci]" || true
          git push || true
