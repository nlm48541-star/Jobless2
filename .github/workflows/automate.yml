name: RSS Video Automation System

on:
  repository_dispatch:
    types: [rss_video_check] 
  workflow_dispatch: 

# 🌟 কনকারেন্সি লক: যাতে একাধিক রান একসাথে কিউ হয়ে আটকে না থাকে
concurrency:
  group: rss-automation-jobless
  cancel-in-progress: true

# 🌟 হিস্টোরি ফাইল গিটহাবে স্বয়ংক্রিয় সেভ করার জন্য পারমিশন
permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 🌟 বাংলা ফন্ট, টেক্সট রেন্ডারিং ইঞ্জিন ও FFmpeg ইনস্টল (Rclone বাদ দেওয়া হয়েছে)
      - name: Install System Dependencies (Fonts, FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-beng fonts-beng-extra libraqm-dev libraqm0 libfribidi0 libharfbuzz0b ffmpeg

      # 🌟 পাইথন ডিপেন্ডেন্সি ইনস্টল
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🌟 ভিডিও তৈরি এবং সরাসরি ইউটিউবে আপলোড (কোনো গুগল ড্রাইভ সিক্রেট লাগবে না)
      - name: Run Python Process (Video Creation & YouTube Upload)
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GROQ_API: ${{ secrets.GROQ_API }}
          Ollama_API_Key: ${{ secrets.Ollama_API_Key }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FISH_API_KEYS: ${{ secrets.FISH_API_KEYS }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          MODAL_ENDPOINTS: ${{ secrets.MODAL_ENDPOINTS }}
          TTS_MODEL: ${{ secrets.TTS_MODEL }}
          TTS_ENGINE: ${{ secrets.TTS_ENGINE }}
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py

      # 🌟 ডুপ্লিকেট রোধ: আপলোড হিস্টোরি রিপোজিটরিতে সেভ ও কমিট
      - name: Save & Commit Upload History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add workspace/history.txt 2>/dev/null || true
          git commit -m "Update upload history [skip ci]" || true
          git push || true
